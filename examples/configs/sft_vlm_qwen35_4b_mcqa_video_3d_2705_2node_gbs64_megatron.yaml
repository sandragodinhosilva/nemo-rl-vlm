defaults:
  - sft_vlm_qwen35_4b_video_local_common_megatron.yaml

sft:
  max_num_epochs: 3
  max_num_steps: 1000000
  val_period: 25
  val_batches: 8
  val_global_batch_size: 32
  val_micro_batch_size: 1
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_4b_mcqa_video_3d_2705_2node_gbs64"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 3
  save_period: 20  # 1324 rows / gbs 32 ~= 42 steps/epoch (no val holdout)
  checkpoint_must_save_by: null

policy:
  # Long-video OOM fix: 0804 has TIER_C trend rows up to 550 frames (~140K
  # tokens, vs 2403's 8-frames-per-rep cap). Mirror the settings that let the
  # 27B human_reps_only config train 65K-token video sequences without OOM.
  # The decisive knob is megatron_cfg.attention_backend: "flash" -- without it
  # TE falls back to the unfused fp32 softmax, which materializes an
  # [heads, S, S] score tensor (the 11.82 GiB allocation that was crashing).
  max_total_sequence_length: 65536
  train_micro_batch_size: 1
  # SCALING TEST (2-node): gbs 64 (2x the 1-node 32). 16 GPUs, TP=2 -> DP=8,
  # so 64 / 8 / mbs1 = 8 micro-batches per replica per step. Larger effective
  # batch changes optimization dynamics; verify_and_fix recomputes the LR
  # schedule + save_period below for the new steps/epoch (~1324/64 ~= 21).
  train_global_batch_size: 64
  megatron_cfg:
    activation_checkpointing: true
    sequence_parallel: true
    attention_backend: "flash"
    context_parallel_size: 1  # flash + sequence_parallel handles 65K; CP not needed
    optimizer:
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0
    scheduler:
      lr_decay_iters: 60  # 1324 rows / gbs 32 ~= 42 steps/epoch x 3 epochs
      lr_warmup_iters: 6  # ~10% warmup

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: false
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 16
  seed: 42
  train:
    dataset_name: thrive-vlm-sft
    data_path: /mnt/data/shared/vlm/data/video_aux_datasets/mcqa_video_3d_2705/arrow_train
    split: train
    split_validation_size: 0  # train on ALL rows; no derived 5% val holdout
  validation: null
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"
    skip_missing_local_media_filter: true
    roles_to_train_on: ["assistant"]

# 8-GPU run: with tensor_model_parallel_size=2 this is 4 model replicas
# (TP spans 2 GPUs each), data-parallel = 4. train_global_batch_size stays 32
# so steps-per-epoch (~42) and the LR schedule (lr_decay_iters: 123) are
# unchanged from the 2-GPU/DP=1 run -- only throughput changes (~4x).
cluster:
  gpus_per_node: 8
  num_nodes: 2

logger:
  log_dir: "logs/sft_qwen35_4b_mcqa_video_3d_2705_2node_gbs64"
  wandb:
    project: "nemo-rl"
    name: "sft_qwen35_4b_mcqa_video_3d_2705_2node_gbs64"
  swanlab:
    project: "nemo-rl"
    name: "sft_qwen35_4b_mcqa_video_3d_2705_2node_gbs64"
  tensorboard:
    log_dir: "logs/sft_qwen35_4b_mcqa_video_3d_2705_2node_gbs64"
  mlflow:
    experiment_name: "nemo-rl"
    run_name: "sft_qwen35_4b_mcqa_video_3d_2705_2node_gbs64"
