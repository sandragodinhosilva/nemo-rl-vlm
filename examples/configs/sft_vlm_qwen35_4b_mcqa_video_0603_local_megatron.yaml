defaults:
  - sft_vlm_qwen35_4b_video_local_common_megatron.yaml

sft:
  max_num_epochs: 3
  max_num_steps: 1000000
  val_period: 25
  val_batches: 8
  val_global_batch_size: 32
  val_micro_batch_size: 1
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_4b_mcqa_video_0603"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 3
  save_period: 32
  checkpoint_must_save_by: null

policy:
  megatron_cfg:
    scheduler:
      lr_decay_iters: 96
      lr_warmup_iters: 10

data:
  train:
    dataset_name: thrive-vlm-sft
    data_path: /mnt/data/shared/vlm/data/video_aux_datasets/mcqa_video_0603
    split: train
  validation:
    dataset_name: thrive-vlm-sft
    data_path: /mnt/data/shared/vlm/data/video_aux_datasets/mcqa_video_0603
    split: validation
  default:
    prompt_file: null
    roles_to_train_on: ["assistant"]

logger:
  log_dir: "logs/sft_qwen35_4b_mcqa_video_0603"
  wandb:
    project: "nemo-rl"
    name: "sft_qwen35_4b_mcqa_video_0603"
  tensorboard:
    log_dir: "logs/sft_qwen35_4b_mcqa_video_0603"
  mlflow:
    experiment_name: "nemo-rl"
    run_name: "sft_qwen35_4b_mcqa_video_0603"
