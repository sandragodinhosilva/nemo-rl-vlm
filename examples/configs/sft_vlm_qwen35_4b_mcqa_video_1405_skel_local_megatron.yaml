defaults:
  - sft_vlm_qwen35_4b_video_local_common_megatron.yaml

# Answer-only mcqa_video_1405 SFT, SKELETON-PARTITIONED. Same 1031 questions
# as the plain answer-only run, but ~50% of rows use skeleton-overlay frames
# (the identical skeleton_partition.json the reasoning dataset uses). This is
# the answer-only arm of the reasoning-vs-answer-only experiment: training it
# on the same 50/50 frame mix as the reasoning model removes frame-type as a
# confound. Counterpart configs: sft_vlm_qwen35_4b_mcqa_video_1405 (plain
# answer-only) and ..._mcqa_video_1405_reasoning (reasoning traces).

sft:
  max_num_epochs: 3
  max_num_steps: 1000000
  val_period: 25
  val_batches: 8
  val_global_batch_size: 32
  val_micro_batch_size: 1
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_4b_mcqa_video_1405_skel"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 3
  save_period: 32  # 1031 rows / gbs 32 ~= 32 steps/epoch (no val holdout)
  checkpoint_must_save_by: null

policy:
  # Long-video OOM fix: 0804 has TIER_C trend rows up to 550 frames (~140K
  # tokens, vs 2403's 8-frames-per-rep cap). Mirror the settings that let the
  # 27B human_reps_only config train 65K-token video sequences without OOM.
  # The decisive knob is megatron_cfg.attention_backend: "flash" -- without it
  # TE falls back to the unfused fp32 softmax, which materializes an
  # [heads, S, S] score tensor (the 11.82 GiB allocation that was crashing).
  max_total_sequence_length: 65536
  train_micro_batch_size: 1
  megatron_cfg:
    activation_checkpointing: true
    sequence_parallel: true
    attention_backend: "flash"
    context_parallel_size: 1  # flash + sequence_parallel handles 65K; CP not needed
    optimizer:
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0
    scheduler:
      lr_decay_iters: 96   # 1031 rows / gbs 32 ~= 32 steps/epoch x 3 epochs
      lr_warmup_iters: 10  # ~10% warmup

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: false
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 16
  seed: 42
  train:
    dataset_name: thrive-vlm-sft
    data_path: /mnt/data/shared/vlm/data/video_aux_datasets/mcqa_video_1405/arrow_train_skel
    split: train
    split_validation_size: 0  # train on ALL rows; no derived 5% val holdout
  validation: null
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"
    skip_missing_local_media_filter: true
    roles_to_train_on: ["assistant"]

logger:
  log_dir: "logs/sft_qwen35_4b_mcqa_video_1405_skel"
  wandb:
    project: "nemo-rl"
    name: "sft_qwen35_4b_mcqa_video_1405_skel"
  swanlab:
    project: "nemo-rl"
    name: "sft_qwen35_4b_mcqa_video_1405_skel"
  tensorboard:
    log_dir: "logs/sft_qwen35_4b_mcqa_video_1405_skel"
  mlflow:
    experiment_name: "nemo-rl"
    run_name: "sft_qwen35_4b_mcqa_video_1405_skel"
