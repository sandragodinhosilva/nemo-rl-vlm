defaults:
  - sft_vlm_qwen35_4b_image_local_common_megatron.yaml

# Image auxiliary SFT for the all-tasks image umbrella group (`2403`).

sft:
  max_num_epochs: 4
  max_num_steps: 1000000
  val_period: 128
  val_batches: 8
  val_global_batch_size: 64
  val_micro_batch_size: 8
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_4b_image_all_tasks_2403"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 4
  save_period: 292
  checkpoint_must_save_by: null

policy:
  megatron_cfg:
    scheduler:
      lr_decay_iters: 1168
      lr_warmup_iters: 117

data:
