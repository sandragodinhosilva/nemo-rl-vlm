defaults:
  - sft_vlm_qwen35_4b_text_local_common_megatron.yaml

# Text auxiliary SFT for the exercise instructions reference dataset.
#
# Dataset:
# - /mnt/data/shared/vlm/data/text_aux_datasets/exercise_instructions_2403/openai_sft
#
# This export provides explicit OpenAI-format JSONL train/validation splits
# derived reproducibly from the promoted HF dataset.

sft:
  max_num_epochs: 4
  max_num_steps: 1000000
  val_period: 4
  val_batches: 4
  val_global_batch_size: 64
  val_micro_batch_size: 8
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_4b_text_aux_exercise_instructions_2403"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 4
  save_period: 4
  checkpoint_must_save_by: null

policy:
  megatron_cfg:
    scheduler:
      lr_decay_iters: 16
      lr_warmup_iters: 2

data:
  train:
    dataset_name: openai_format
    data_path: /mnt/data/shared/vlm/data/text_aux_datasets/exercise_instructions_2403/openai_sft/train.jsonl
    split: train
  validation:
    dataset_name: openai_format
    data_path: /mnt/data/shared/vlm/data/text_aux_datasets/exercise_instructions_2403/openai_sft/validation.jsonl
    split: train
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"
    roles_to_train_on: ["assistant"]

logger:
  log_dir: "logs/sft_qwen35_4b_text_aux_exercise_instructions_2403"
  wandb:
    project: "nemo-rl"
    name: "sft_qwen35_4b_text_aux_exercise_instructions_2403"
  swanlab:
    project: "nemo-rl"
    name: "sft_qwen35_4b_text_aux_exercise_instructions_2403"
  tensorboard:
    log_dir: "logs/sft_qwen35_4b_text_aux_exercise_instructions_2403"
  mlflow:
    experiment_name: "nemo-rl"
    run_name: "sft_qwen35_4b_text_aux_exercise_instructions_2403"
