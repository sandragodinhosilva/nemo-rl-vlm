      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/sgsilva/vlm-post-training/analysis/reduced_text_sft_mix_20260330/materialized_openai_sft/patient_qa_mcqa_qwen_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/sgsilva/vlm-post-training/analysis/reduced_text_sft_mix_20260330/materialized_openai_sft/patient_qa_open_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
