      data_path: /mnt/data/shared/vlm/data/text_aux_datasets/patient_qa_mcqa_incorrect_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/text_aux_datasets/patient_qa_mcqa_qwen_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/text_aux_datasets/patient_qa_mcqa_incorrect_qwen_2403/openai_sft/validation.jsonl
      split: train
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"
    roles_to_train_on: ["assistant"]

logger:
  log_dir: "logs/sft_qwen35_4b_text_aux_reduced_5k_20260330_mcqa_eval"
  wandb:
    project: "nemo-rl"
    name: "sft_qwen35_4b_text_aux_reduced_5k_20260330_mcqa_eval"
  swanlab:
    project: "nemo-rl"
    name: "sft_qwen35_4b_text_aux_reduced_5k_20260330_mcqa_eval"
  tensorboard:
