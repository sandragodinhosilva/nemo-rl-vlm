      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/sgsilva/vlm-post-training/analysis/reduced_text_sft_mix_20260330/materialized_openai_sft/technical_tips_natural_2403/openai_sft/train.jsonl
      split: train
  validation:
