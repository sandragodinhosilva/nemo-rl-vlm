defaults:
  - sft_vlm_qwen35_4b_text_local_common_megatron.yaml

# Reduced 5k text auxiliary SFT mix derived from the 2026-03-30 audit.
#
# Train on the materialized reduced OpenAI-format JSONLs produced by:
# /mnt/data/sgsilva/vlm-post-training/aux_tasks/sft/materialize_reduced_text_sft_mix.py
#
# Validation reuses the current promoted MCQA validation exports so this run stays
# directly comparable to the existing text checkpoints.

sft:
  max_num_epochs: 4
  max_num_steps: 1000000
  val_period: 78
  val_batches: 8
  val_global_batch_size: 64
  val_micro_batch_size: 8
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_4b_text_aux_reduced_5k_20260330_mcqa_eval"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 4
  save_period: 78
  checkpoint_must_save_by: null

policy:
  megatron_cfg:
    scheduler:
      lr_decay_iters: 312
      lr_warmup_iters: 32

data:
  train:
    - dataset_name: openai_format
      data_path: /mnt/data/sgsilva/vlm-post-training/analysis/reduced_text_sft_mix_20260330/materialized_openai_sft/clinical_reasoning_natural_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/sgsilva/vlm-post-training/analysis/reduced_text_sft_mix_20260330/materialized_openai_sft/exercise_instructions_natural_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/sgsilva/vlm-post-training/analysis/reduced_text_sft_mix_20260330/materialized_openai_sft/mcqa_error_correction_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/sgsilva/vlm-post-training/analysis/reduced_text_sft_mix_20260330/materialized_openai_sft/mcqa_error_recognition_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/sgsilva/vlm-post-training/analysis/reduced_text_sft_mix_20260330/materialized_openai_sft/mcqa_muscle_exercise_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/sgsilva/vlm-post-training/analysis/reduced_text_sft_mix_20260330/materialized_openai_sft/mcqa_phase_sequencing_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/sgsilva/vlm-post-training/analysis/reduced_text_sft_mix_20260330/materialized_openai_sft/patient_qa_mcqa_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/sgsilva/vlm-post-training/analysis/reduced_text_sft_mix_20260330/materialized_openai_sft/patient_qa_mcqa_incorrect_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/sgsilva/vlm-post-training/analysis/reduced_text_sft_mix_20260330/materialized_openai_sft/patient_qa_mcqa_incorrect_qwen_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
