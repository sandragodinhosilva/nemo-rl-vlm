      data_path: /mnt/data/shared/vlm/data/text_aux_datasets/mcqa_error_correction_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/text_aux_datasets/mcqa_error_recognition_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/text_aux_datasets/mcqa_muscle_exercise_2403/openai_sft/validation.jsonl
