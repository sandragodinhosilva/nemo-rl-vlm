defaults:
  - sft_vlm_qwen35_4b_image_local_common_megatron.yaml

# Image auxiliary SFT for the all-tasks image umbrella group (`3103`).
# Note: this config overrides the inherited single-dataset `data` block with a
# multi-dataset list. Keep `data._override_: true` so OmegaConf does not try to
# merge the base dict-shaped `data.train` / `data.validation` entries from
# `sft.yaml` into these list-shaped entries at runtime.

sft:
  max_num_epochs: 4
  max_num_steps: 1000000
  val_period: 128
  val_batches: 8
  val_global_batch_size: 64
  val_micro_batch_size: 8
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_4b_image_all_tasks_3103"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 4
  save_period: 886
  checkpoint_must_save_by: null

policy:
  megatron_cfg:
    scheduler:
      lr_decay_iters: 3544
      lr_warmup_iters: 355

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: true
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 8
  seed: 42
  train:
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task1_3103/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task1b_3103/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task1c_3103/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task2_3103/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task3a_3103/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task3b_3103/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task3c_3103/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task3d_3103/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task4a_3103/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task4b_3103/openai_sft/train.jsonl
      split: train
  validation:
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task1_3103/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task1b_3103/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task1c_3103/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task2_3103/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task3a_3103/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task3b_3103/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task3c_3103/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task3d_3103/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task4a_3103/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/image_aux_datasets/task4b_3103/openai_sft/validation.jsonl
      split: train
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"
    roles_to_train_on: ["assistant"]

logger:
  log_dir: "logs/sft_qwen35_4b_image_all_tasks_3103"
  wandb:
    project: "nemo-rl"
    name: "sft_qwen35_4b_image_all_tasks_3103"
  swanlab:
    project: "nemo-rl"
    name: "sft_qwen35_4b_image_all_tasks_3103"
  tensorboard:
    log_dir: "logs/sft_qwen35_4b_image_all_tasks_3103"
  mlflow:
    experiment_name: "nemo-rl"
    run_name: "sft_qwen35_4b_image_all_tasks_3103"
