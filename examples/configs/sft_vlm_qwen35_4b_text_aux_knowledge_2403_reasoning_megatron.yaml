defaults:
  - sft_vlm_qwen35_4b_text_local_common_megatron.yaml

# Parallel reasoning-analysis SFT for the matched `2403` text knowledge roots.
#
# Train only on the promoted reasoning siblings that already exist on disk:
# - /mnt/data/shared/vlm/data/text_aux_datasets/clinical_reasoning_natural_reasoning_2403/openai_sft/train.jsonl
# - /mnt/data/shared/vlm/data/text_aux_datasets/exercise_instructions_natural_reasoning_2403/openai_sft/train.jsonl
# - /mnt/data/shared/vlm/data/text_aux_datasets/technical_tips_natural_reasoning_2403/openai_sft/train.jsonl
#
# This intentionally excludes the canonical non-reasoning MCQA error families so the
# existing `text_knowledge_2403` line remains unchanged for side-by-side comparison.

sft:
  max_num_epochs: 4
  max_num_steps: 1000000
  val_period: 18
  val_batches: 4
  val_global_batch_size: 64
  val_micro_batch_size: 8
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_4b_text_aux_knowledge_2403_reasoning"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 4
  save_period: 18
  checkpoint_must_save_by: null

policy:
  megatron_cfg:
    scheduler:
      lr_decay_iters: 72
      lr_warmup_iters: 8

data:
  train:
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/text_aux_datasets/clinical_reasoning_natural_reasoning_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/text_aux_datasets/exercise_instructions_natural_reasoning_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/text_aux_datasets/technical_tips_natural_reasoning_2403/openai_sft/train.jsonl
      split: train
  validation:
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/text_aux_datasets/clinical_reasoning_natural_reasoning_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/text_aux_datasets/exercise_instructions_natural_reasoning_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/text_aux_datasets/technical_tips_natural_reasoning_2403/openai_sft/validation.jsonl
      split: train
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"
    roles_to_train_on: ["assistant"]

logger:
  log_dir: "logs/sft_qwen35_4b_text_aux_knowledge_2403_reasoning"
  wandb:
    project: "nemo-rl"
    name: "sft_qwen35_4b_text_aux_knowledge_2403_reasoning"
  swanlab:
    project: "nemo-rl"
    name: "sft_qwen35_4b_text_aux_knowledge_2403_reasoning"
  tensorboard:
    log_dir: "logs/sft_qwen35_4b_text_aux_knowledge_2403_reasoning"
  mlflow:
    experiment_name: "nemo-rl"
    run_name: "sft_qwen35_4b_text_aux_knowledge_2403_reasoning"
