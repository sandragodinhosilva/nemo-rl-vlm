defaults:
  - sft_vlm_qwen35_4b_video_local_common_megatron.yaml

# First full mixed-modality SFT run across the materialized baseline_all_tasks root.

sft:
  max_num_epochs: 3
  max_num_steps: 1000000
  val_period: 600
  val_batches: 8
  val_global_batch_size: 32
  val_micro_batch_size: 1
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_4b_baseline_all_tasks"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 4
  save_period: 2407
  checkpoint_must_save_by: null

policy:
  megatron_cfg:
    scheduler:
      lr_decay_iters: 7221
      lr_warmup_iters: 723

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: false
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 16
  seed: 42
  train:
    - dataset_name: thrive-vlm-sft
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/multimodal_sft_mixes_20260401/baseline_all_tasks
      split: train
  validation: null
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"
    skip_missing_local_media_filter: true
    roles_to_train_on: ["assistant"]

logger:
  log_dir: "logs/sft_qwen35_4b_baseline_all_tasks"
  wandb:
    project: "nemo-rl"
    name: "sft_qwen35_4b_baseline_all_tasks"
  swanlab:
    project: "nemo-rl"
    name: "sft_qwen35_4b_baseline_all_tasks"
  tensorboard:
    log_dir: "logs/sft_qwen35_4b_baseline_all_tasks"
  mlflow:
    experiment_name: "nemo-rl"
    run_name: "sft_qwen35_4b_baseline_all_tasks"
