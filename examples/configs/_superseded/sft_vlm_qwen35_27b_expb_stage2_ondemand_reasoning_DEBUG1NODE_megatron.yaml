# SPENT DEBUG CONFIG (2026-07-04) — do not reuse as-is.
# 1-node clone of sft_vlm_qwen35_27b_expb_stage2_ondemand_reasoning_megatron.yaml used by SLURM
# job 107448 to capture NVTE backend-disable reasons for the step-1 crash. Still contains the
# BROKEN attention_backend:"flash" + NVTE_DEBUG env it was built to diagnose (fix = "auto",
# applied to the parent config). Kept for provenance; see report
# 2026-07-04_expb_stage2_sft_params_and_slowdown_diagnosis.md §5.
defaults: sft.yaml

# EXP-B stage-2 native reasoner SFT (27B thinkON, ondemand stance).
# TARGET dataset: /mnt/data/sgsilva/datasets/1806/expb_stage2_train_ondemand_flagkeep_reasoning_sft_ready
#   - 8,991 rows (judge accept-only, 85.2% of 10,552 judgeable). Each row's assistant target =
#       <think>...ondemand reasoning trace (3 teachers x 3 styles, WITH video)...</think>
#       [MOVEMENT ANALYSIS]/[ERRORS]/[SCORES]/[FEEDBACK] GT bracket answer
#   - User turn = ondemand production prompt (stage2_stance_registry) + 2906 categorical_k5majority
#     obs block; uncovered errors carry the flag_keep handoff note.
#   - Validation = expb_stage2_from_raw_ondemand_test_flagkeep (2,157 rows, no traces — answer-only
#     val loss; same pattern as the 4B stage-1 reasoning config's non-reasoning val split).
#
# PARAMS — anchored to the June-3 good run (training_qwen35_27b_oracle_obs_merged_reasoning_1805,
# 4-node TP4xDP8, 21.7s/step, 2154 steps clean), NOT the 05-28+ single-node wrappers:
#   - cluster 4 nodes x 8 GPU, TP=4 PP=1 -> DP=8 (Sandra-approved 2026-07-04). The 05-28 switch of
#     the reasoning wrapper to --nodes=1 (TP4xDP2) is the measured 2.4x/step slowdown (53-55s/step):
#     video steps are data-bound, so step time scales with samples-per-DP-replica (GBS32/DP).
#   - max_total_sequence_length 65536: _sft_ready text tokens p99~2.9k but frames p50/p95/p99/max =
#     29/108/325/571 at ~300-335 vision tok/frame -> 65536 covers ~p97.4; ~237 rows (2.6%) exceed it
#     and are zero-loss-masked by the processor (same behavior as all past 27B runs; 32784 would
#     waste ~5.6%).
#   - lr 5e-6 cosine / 3 epochs / GBS 32: unchanged from anchor — this run's treatment is the
#     stage-2 data, not hyperparameters (lr has never been swept; keep it single-valued).
#   - enable_thinking: true (thinkON is the whole point of EXP-B).
#
# Step math (verify_and_fix_config will recompute):
#   train rows: 8,991   steps/epoch: ~281   3 epochs: ~843 steps
#   lr_decay_iters: 843   lr_warmup_iters: 84   save_period: 281 (per epoch)

sft:
  max_num_epochs: 3
  max_num_steps: 1000000
  val_period: 94             # ~3x per epoch on the 2,157-row no-trace test split
  val_batches: 8
  val_global_batch_size: 16
  val_micro_batch_size: 1
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_27b_expb_stage2_ondemand_reasoning_DEBUG1NODE"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 3
  save_period: 281          # save at end of each epoch
  checkpoint_must_save_by: null

policy:
  model_name: /mnt/data/shared/models/Qwen3.5-27B/
  tokenizer:
    name: ${policy.model_name}
    chat_template: null
    chat_template_kwargs:
      enable_thinking: true
  train_global_batch_size: 32
  train_micro_batch_size: 1
  max_total_sequence_length: 65536
  precision: "bfloat16"

  offload_optimizer_for_logprob: false

  dtensor_cfg:
    enabled: false

  dynamic_batching:
    enabled: false

  sequence_packing:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}
  max_grad_norm: 1.0
  optimizer: null
  scheduler: null

  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 1
    activation_checkpointing: true
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    sequence_parallel: true
    context_parallel_size: 1
    pipeline_dtype: ${policy.precision}
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    freeze_moe_router: false
    moe_router_dtype: "fp64"
    moe_router_load_balancing_type: "none"
    moe_router_bias_update_rate: 0.0
    moe_permute_fusion: false
    moe_token_dispatcher_type: "alltoall"
    moe_grouped_gemm: true
    moe_per_layer_logging: false
    apply_rope_fusion: false
    bias_activation_fusion: true
    attention_backend: "flash"
    defer_fp32_logits: false

    optimizer:
      optimizer: "adam"
      lr: 5e-6
      min_lr: 5e-7
      weight_decay: 0.01
      bf16: true
      fp16: false
      params_dtype: "float32"
      adam_beta1: 0.9
      adam_beta2: 0.98
      adam_eps: 1e-8
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: ${policy.max_grad_norm}
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "cosine"
      lr_decay_iters: 840    # 3 epochs * ~281 steps
      lr_warmup_iters: 84    # ~10% of decay
      lr_warmup_init: 0

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: false
      average_in_collective: true
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      # TEMP DEBUG (remove after diagnosis): print TE attention-backend selection reasons —
      # job 107277 died step-1 with "No dot product attention backend is available".
      NVTE_DEBUG: "1"
      NVTE_DEBUG_LEVEL: "2"

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: true
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 8
  seed: 42
  train:
    dataset_name: thrive-vlm-sft
    data_path: /mnt/data/sgsilva/datasets/1806/expb_stage2_train_ondemand_flagkeep_reasoning_sft_ready
    split: train
    split_validation_size: 0
  validation:
    dataset_name: thrive-vlm-sft
    data_path: /mnt/data/sgsilva/datasets/1806/expb_stage2_from_raw_ondemand_test_flagkeep
    split: train
    split_validation_size: 0
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"
    skip_missing_local_media_filter: true
    roles_to_train_on: ["assistant"]

logger:
  log_dir: "logs/sft_qwen35_27b_expb_stage2_ondemand_reasoning"
  wandb_enabled: false
  tensorboard_enabled: true
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: "nemo-rl"
    name: "sft_qwen35_27b_expb_stage2_ondemand_reasoning"
  swanlab:
    project: "nemo-rl"
    name: "sft_qwen35_27b_expb_stage2_ondemand_reasoning"
  tensorboard:
    log_dir: "logs/sft_qwen35_27b_expb_stage2_ondemand_reasoning"
  mlflow:
    experiment_name: "nemo-rl"
    run_name: "sft_qwen35_27b_expb_stage2_ondemand_reasoning"
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 8
  num_nodes: 1
