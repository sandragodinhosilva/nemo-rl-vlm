# GRPO over multi-turn query_obs tool-loop rollouts — 27B VObs-tool SFT model, thinkOFF.
# SCAFFOLD (sgsilva 2026-07-13) — NOT LAUNCHABLE YET, two hard placeholders below:
#   1. policy.model_name — the VObs-tool SFT 27B ckpt DOES NOT EXIST (pilot-2k dataset
#      generating 2026-07-13; SFT is a later step).
#   2. data.*.dataset_path — the vobs_tool GRPO dataset (dataset_type="vobs_tool" +
#      folder_name/repetition_id columns) is NOT MATERIALIZED (launch-gated).
# Design + reward rationale: ~/.claude/reports/post_training/2026-07-13_grpo_vobs_tool_scaffold.md
# Cloned from vlm_grpo_qwen35_4b_mix_12k_1506.yaml (tested reference); 27B topology from
# vlm_grpo_qwen35_27b_thrive.yaml (megatron TP=4), shrunk to the 1-node precedent.

grpo:
  num_prompts_per_step: 16
  num_generations_per_prompt: 8
  # THE multi-turn switch: max_tool_rounds(4) tool turns + 1 final-answer turn.
  # Every other recipe runs 1; the loop itself already exists (rollout-flow map report).
  max_rollout_turns: 5
  max_num_epochs: 1
  max_num_steps: 120   # PLACEHOLDER — recompute as ~0.5 epoch (train_rows/16 ÷ 2) once the
                       # vobs_tool GRPO dataset exists (verify_and_fix_config at launch).
  normalize_rewards: true
  use_leave_one_out_baseline: true
  val_period: 30
  val_at_start: true
  val_at_end: true
  overlong_filtering: true    # flaw-audit fix #1 — truncated rollouts must not train as low reward
  max_val_samples: 256
  val_batch_size: 256
  seed: 42
  # Low-cardinality per-rep F1 ⇒ many all-same-reward groups (dead gradient). Dynamic
  # sampling skips zero-std groups and backfills (validated lever, GRPO_VISUAL_OBS_SETUP §5.9).
  use_dynamic_sampling: true
  batch_multiplier: 2
  dynamic_sampling_max_gen_batches: 4
  reward_shaping:
    enabled: false
    overlong_buffer_length: 512
    overlong_buffer_penalty: 1
    max_response_length: ${policy.max_total_sequence_length}
  reward_scaling:
    enabled: false
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0
  async_grpo:
    enabled: false
    max_trajectory_age_steps: 1
  seq_logprob_error_threshold: null

loss_fn:
  reference_policy_kl_penalty: 0.01
  reference_policy_kl_type: "k3"
  kl_input_clamp_value: 20.0
  kl_output_clamp_value: 10.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  ratio_clip_c: null
  use_on_policy_kl_approximation: false
  use_importance_sampling_correction: false
  truncated_importance_sampling_ratio: null
  token_level_loss: true
  force_on_policy_ratio: false

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/grpo_sft_vobs_tool_27b_thinkoff"
  metric_name: "val:accuracy"
  higher_is_better: true
  keep_top_k: 3
  save_period: 30
  checkpoint_must_save_by: null

policy:
  # ⛔ PLACEHOLDER — the VObs-tool SFT 27B does not exist yet (2026-07-13). Point at the
  # exported HF dir once the pilot SFT lands; lint_model_name + verify_and_fix at launch.
  model_name: /mnt/data/sgsilva/models/TODO_qwen35-27b-vobs-tool-sft-stepN__DOES_NOT_EXIST_YET
  tokenizer:
    name: ${policy.model_name}
  train_global_batch_size: 16
  train_micro_batch_size: 1
  generation_batch_size: 16
  logprob_batch_size: 2   # 27B: halved vs the 4B reference's 4 (logprob fwd is seqlen×model bound)
  # ≥62k rule (a 48650-tok video prompt blew 32784); tool turns add only ~0.5-2k text tokens on
  # top of the video prompt — MEASURE the true max multi-turn length on the pilot rows at launch
  # (report §5) before trusting this.
  max_total_sequence_length: 62000
  precision: "bfloat16"
  offload_optimizer_for_logprob: false

  dtensor_cfg:
    _v2: true
    enabled: false
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null

  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}
  max_grad_norm: 1.0

  sequence_packing:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64

  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 0.1
      end_factor: 1.0
      total_iters: 50
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1.0
      total_iters: 10000000000
  - milestones:
    - 50

  generation:
    backend: vllm
    max_new_tokens: 16384   # per TURN; thinkOFF final answers are short, tool turns shorter
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    # NO "</tool_call>" stop string — the 2026-07-12 stop-seq-in-<think> bug class; turns end
    # at the model's natural im_end and the env parses ALL calls in the finished turn.
    stop_strings: null
    tokenizer:
      name: ${policy.model_name}
    vllm_cfg:
      async_engine: false     # sync colocated = the proven B300 path
      precision: ${policy.precision}
      kv_cache_dtype: "auto"
      tensor_parallel_size: 4  # 27B on 1 node: 2 vLLM engines of TP4 colocated with megatron TP4
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.8
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: true      # B300: torch 2.10+cu130 has no aot_compile (setup doc §5.4)
      enable_expert_parallel: false
      skip_tokenizer_init: False
    vllm_kwargs:
      attention_backend: "FLASH_ATTN"
      media_io_kwargs:
        video:
          num_frames: 2048
      mm_processor_kwargs:
        size:
          longest_edge: 102000000
          shortest_edge: 4096
    colocated:
      enabled: true
      resources:
        gpus_per_node: 8
        num_nodes: 1

  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 1
    activation_checkpointing: true   # 27B long-seq backward headroom (IPC-safe OOM lever)
    converter_type: "Qwen2ForCausalLM"
    tensor_model_parallel_size: 4    # 27B (4B reference uses 2)
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    sequence_parallel: false
    context_parallel_size: 1
    pipeline_dtype: ${policy.precision}
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    freeze_moe_router: true
    moe_router_dtype: "fp64"
    moe_router_load_balancing_type: "none"
    moe_router_bias_update_rate: 0.0
    moe_permute_fusion: false
    moe_token_dispatcher_type: "allgather"
    moe_enable_deepep: false
    moe_shared_expert_overlap: false
    moe_grouped_gemm: true
    moe_per_layer_logging: false
    apply_rope_fusion: false
    bias_activation_fusion: true
    defer_fp32_logits: false

    optimizer:
      optimizer: "adam"
      lr: 2.0e-07
      min_lr: 2.0e-07
      weight_decay: 0.01
      bf16: true
      fp16: false
      params_dtype: "float32"
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1.0e-08
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: ${policy.max_grad_norm}
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: 1000
      lr_warmup_iters: 50
      lr_warmup_init: 2.0e-08

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: true
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:False"   # colocated IPC weight refit requires False

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  train:
    dataset_name: "thrive-vlm"
    # ⛔ PLACEHOLDER — vobs_tool GRPO dataset not materialized (launch-gated). Must carry
    # dataset_type="vobs_tool", folder_name, repetition_id, need_to_flip, messages(sys/user/GT).
    dataset_path: /mnt/data/sgsilva/datasets/1806/TODO_vobs_tool_grpo__NOT_MATERIALIZED_YET
    env_name: "visual-obs"
    split: "train"
    shuffle: true
    num_workers: 8
    prompt_file: null
    system_prompt_file: null
  validation:
    dataset_name: "thrive-vlm"
    dataset_path: /mnt/data/sgsilva/datasets/1806/TODO_vobs_tool_grpo__NOT_MATERIALIZED_YET
    env_name: "visual-obs"
    split: "validation"
    shuffle: false
    num_workers: 8
    prompt_file: null
    system_prompt_file: null

env:
  visual-obs:
    num_workers: 8
    # Tool-rollout bridge (report §2.0b + §2.2 + §4.2). bank_mode=gt is CANARY-ONLY.
    tool_rollout:
      enabled: true
      obs_bank_path: /mnt/data/sgsilva/results/visual_obs/runs/2906_splits/oracle_2906_merged_k5majority_categorical_1806_train.json
      bank_mode: corrupted        # model_obs | corrupted | gt — deployment-distribution rule (§2.0b)
      corruption_rate: 0.48       # ≈ the 4B stage-1's 52.4% micro-F1; seeded per (rep, question)
      corruption_seed: 0
      model_obs_bank_path: null   # set when the pregenerated 4B train-split bank exists (§7)
      max_tool_rounds: 4          # grpo.max_rollout_turns must be ≥ this + 1
      # answer composite (f1-anchored, §2.1-A)
      f1_weight: 0.40
      detection_weight: 0.15
      severity_weight: 0.25
      correctness_weight: 0.10
      format_weight: 0.10
      # tool-shaping penalties — multiplicative, total-capped at 0.15 (§2.2)
      malformed_call_penalty: 0.05
      offbank_question_penalty: 0.03
      round_penalty: 0.02
      question_penalty: 0.0       # default OFF (§2.1-B)

logger:
  log_dir: "/mnt/data/sgsilva/logs/grpo_logs/grpo_sft_vobs_tool_27b_thinkoff"
  wandb_enabled: false
  tensorboard_enabled: true
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  num_val_samples_to_print: 4
  wandb:
    project: "nemo-rl-vlm"
    name: "grpo_sft_vobs_tool_27b_thinkoff"
  tensorboard:
    log_dir: "/mnt/data/sgsilva/logs/grpo_logs/grpo_sft_vobs_tool_27b_thinkoff"
  mlflow:
    experiment_name: "nemo-rl-vlm"
    run_name: "grpo_sft_vobs_tool_27b_thinkoff"
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 8
  num_nodes: 1
