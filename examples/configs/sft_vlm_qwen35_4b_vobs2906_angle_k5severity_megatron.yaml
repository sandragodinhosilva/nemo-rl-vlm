defaults:
  - sft_vlm_qwen35_4b_video_local_common_megatron.yaml

sft:
  max_num_epochs: 3
  max_num_steps: 1000000
  val_period: 25
  val_batches: 8
  val_global_batch_size: 32
  val_micro_batch_size: 1
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_4b_vobs2906_angle_k5severity"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 3
  save_period: 110   # ~330 steps/epoch (10559 rows / gbs 32); verify_and_fix_config will correct
  checkpoint_must_save_by: null

policy:
  max_total_sequence_length: 32784
  train_micro_batch_size: 1
  megatron_cfg:
    tensor_model_parallel_size: 4   # was 2; TP=4 halves per-GPU VRAM (OOM fix for job 104267)
    activation_checkpointing: false
    sequence_parallel: false
    # post-save GPU-fragmentation OOM fix (feedback_post_save_oom): job 104267 OOM'd after 3h36m
    # with expandable_segments:False (the default). True lets the allocator reclaim fragmented VRAM.
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    scheduler:
      lr_decay_iters: 987   # ~330 steps/epoch x 3; verify_and_fix_config will correct
      lr_warmup_iters: 99   # ~10% warmup; verify_and_fix_config will correct

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: false
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 16
  seed: 42
  train:
    dataset_name: thrive-vlm-sft
    data_path: /mnt/data/shared/vlm/data/human_annotation_datasets/1806_after_format_review_visual_obs/1806_oracle_obs_sft_train_angle_k5severity
    split: train
    split_validation_size: 0
  validation:
    dataset_name: thrive-vlm-sft
    data_path: /mnt/data/shared/vlm/data/human_annotation_datasets/1806_after_format_review_visual_obs/1806_oracle_obs_sft_test_angle_k5severity
    split: train
    split_validation_size: 0
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"
    skip_missing_local_media_filter: true
    roles_to_train_on: ["assistant"]

cluster:
  gpus_per_node: 4   # was 2; must match TP=4 (world_size = gpus_per_node*num_nodes ≥ TP)
  num_nodes: 1

logger:
  log_dir: "logs/sft_qwen35_4b_vobs2906_angle_k5severity"
  wandb:
    project: "nemo-rl"
    name: "sft_qwen35_4b_vobs2906_angle_k5severity"
  swanlab:
    project: "nemo-rl"
    name: "sft_qwen35_4b_vobs2906_angle_k5severity"
  tensorboard:
    log_dir: "logs/sft_qwen35_4b_vobs2906_angle_k5severity"
  mlflow:
    experiment_name: "nemo-rl"
    run_name: "sft_qwen35_4b_vobs2906_angle_k5severity"
