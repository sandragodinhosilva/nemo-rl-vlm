defaults:
  - sft_vlm_qwen35_4b_text_local_common_megatron.yaml

# Packaged alias of the reduced 5k text auxiliary SFT mix materialized at:
# /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403
#
# Train and validation both point at the compatibility JSONL tree under that root
# so this config stays runnable with the existing openai_format loader.

sft:
  max_num_epochs: 4
  max_num_steps: 1000000
  val_period: 78
  val_batches: 8
  val_global_batch_size: 64
  val_micro_batch_size: 8
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_4b_text_5k_2403_mcqa_eval"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 4
  save_period: 78
  checkpoint_must_save_by: null

policy:
  megatron_cfg:
    scheduler:
      lr_decay_iters: 312
      lr_warmup_iters: 32

data:
  train:
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/clinical_reasoning_natural_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/exercise_instructions_natural_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/mcqa_error_correction_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/mcqa_error_recognition_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/mcqa_muscle_exercise_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/mcqa_phase_sequencing_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/patient_qa_mcqa_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/patient_qa_mcqa_incorrect_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/patient_qa_mcqa_incorrect_qwen_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/patient_qa_mcqa_postsession_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/patient_qa_mcqa_qwen_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/patient_qa_open_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/patient_qa_open_postsession_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/patient_qa_open_qwen_2403/openai_sft/train.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/technical_tips_natural_2403/openai_sft/train.jsonl
      split: train
  validation:
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/mcqa_error_correction_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/mcqa_error_recognition_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/mcqa_muscle_exercise_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/mcqa_phase_sequencing_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/patient_qa_mcqa_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/patient_qa_mcqa_incorrect_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/patient_qa_mcqa_qwen_2403/openai_sft/validation.jsonl
      split: train
    - dataset_name: openai_format
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/text_5k_2403/patient_qa_mcqa_incorrect_qwen_2403/openai_sft/validation.jsonl
      split: train
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"
    roles_to_train_on: ["assistant"]

logger:
  log_dir: "logs/sft_qwen35_4b_text_5k_2403_mcqa_eval"
  wandb:
    project: "nemo-rl"
    name: "sft_qwen35_4b_text_5k_2403_mcqa_eval"
  swanlab:
    project: "nemo-rl"
    name: "sft_qwen35_4b_text_5k_2403_mcqa_eval"
  tensorboard:
    log_dir: "logs/sft_qwen35_4b_text_5k_2403_mcqa_eval"
  mlflow:
    experiment_name: "nemo-rl"
    run_name: "sft_qwen35_4b_text_5k_2403_mcqa_eval"
