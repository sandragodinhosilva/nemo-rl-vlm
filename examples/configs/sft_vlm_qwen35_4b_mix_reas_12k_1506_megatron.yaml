defaults: sft.yaml

# mix_reas_12k_1506 (REBUILT 2026-06-15) -- balanced strict-mirror REASONING mix, 100% 397B
# judge-improved traces. Built by aux_tasks/sft/build_balanced_1506.py from a stratified subset
# of reas2_mix_image10k_text5k_video10k_0804 + judge-filtered v3 (1042) + judged mcqa_video_1505 (946).
# Same 13,887 questions as mix_12k_1506; assistant turns carry real <think>. 434 steps/epoch @
# tgbs 32; 3 epochs = 1302 steps. Non-reasoning: mix_12k_1506.

sft:
  max_num_epochs: 3
  max_num_steps: 1000000
  val_period: 393
  val_batches: 8
  val_global_batch_size: 32
  val_micro_batch_size: 1
  val_at_start: false
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/data/sgsilva/checkpoints/sft_qwen35_4b_mix_reas_12k_1506"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 3
  save_period: 393
  checkpoint_must_save_by: null

policy:
  model_name: "Qwen/Qwen3.5-4B"
  tokenizer:
    name: ${policy.model_name}
    chat_template_kwargs:
      enable_thinking: false
  train_global_batch_size: 32
  train_micro_batch_size: 1
  # Standard 32K config: the long-video OOM fix is NOT needed anymore — mcqa_video_1505 was
  # re-capped (2026-05-21 17:16) so the 8 long Tier-B rows are now <=550 frames. Max video frames
  # in mix_12k_2005 is now 600 (open-video tail), MCQA <=550 — all comfortably under 32K tokens.
  max_total_sequence_length: 32768
  precision: "bfloat16"

  offload_optimizer_for_logprob: false

  dtensor_cfg:
    enabled: false

  dynamic_batching:
    enabled: false

  sequence_packing:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}
  max_grad_norm: 1.0
  optimizer: null
  scheduler: null

  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 1
    activation_checkpointing: false
    converter_type: "Qwen2ForCausalLM"
    tensor_model_parallel_size: 2    # TP=2 across both B300 (one replica), standard 32K recipe
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    sequence_parallel: false
    context_parallel_size: 1
    pipeline_dtype: ${policy.precision}
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    freeze_moe_router: true
    moe_router_dtype: "fp64"
    moe_router_load_balancing_type: "none"
    moe_router_bias_update_rate: 0.0
    moe_permute_fusion: false
    moe_token_dispatcher_type: "allgather"
    moe_enable_deepep: false
    moe_shared_expert_overlap: false
    moe_grouped_gemm: true
    moe_per_layer_logging: false
    apply_rope_fusion: false
    bias_activation_fusion: true
    defer_fp32_logits: false

    optimizer:
      optimizer: "adam"
      lr: 5e-6
      min_lr: 5e-7
      weight_decay: 0.01
      bf16: true
      fp16: false
      params_dtype: "float32"
      adam_beta1: 0.9
      adam_beta2: 0.98
      adam_eps: 1e-8
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: ${policy.max_grad_norm}
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "cosine"
      lr_decay_iters: 1299
      lr_warmup_iters: 130
      lr_warmup_init: 0

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: false
      average_in_collective: true
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"   # keep: reduces fragmentation, harmless at 32K

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: false
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 16
  seed: 42
  train:
    - dataset_name: thrive-vlm-sft
      data_path: /mnt/data/shared/vlm/data/merged_aux_datasets/mix_reas_12k_1506
      split: train
  validation: null
  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"
    skip_missing_local_media_filter: true
    roles_to_train_on: ["assistant"]

logger:
  log_dir: "logs/sft_qwen35_4b_mix_reas_12k_1506"
  wandb_enabled: false
  tensorboard_enabled: true
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: "nemo-rl"
    name: "sft_qwen35_4b_mix_reas_12k_1506"
  swanlab:
    project: "nemo-rl"
    name: "sft_qwen35_4b_mix_reas_12k_1506"
  tensorboard:
    log_dir: "logs/sft_qwen35_4b_mix_reas_12k_1506"
  mlflow:
    experiment_name: "nemo-rl"
    run_name: "sft_qwen35_4b_mix_reas_12k_1506"
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 2   # B300 x2: TP=2 (one replica), standard 32K recipe
  num_nodes: 1
